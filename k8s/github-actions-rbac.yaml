apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-exchange
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - create
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - exchange-config
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - exchange-secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-exchange
subjects:
- kind: Group
  name: github-actions-exchange
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-actions-exchange
  apiGroup: rbac.authorization.k8s.io
