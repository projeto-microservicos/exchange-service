services:
  cache:
    image: redis:8.2-alpine
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbit:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: exchange-test
      RABBITMQ_DEFAULT_PASS: ${EXCHANGE_TEST_RABBIT_PASSWORD:?Set temporary test password}
    ports: ["127.0.0.1::5672"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
